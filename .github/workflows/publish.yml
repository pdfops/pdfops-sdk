name: Publish

# Tag-triggered publish via npm trusted publishing (GitHub Actions OIDC), same
# shape as pdfops-mcp and n8n-nodes-pdfops. No npm token: nothing to expire.
#
# One-time setup on npmjs.com (package -> Settings -> Trusted Publishers):
#   Organization or user: pdfops
#   Repository:           pdfops-sdk
#   Workflow filename:    publish.yml
#   Environment name:     (blank)

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >=22.14.0 and npm >=11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - name: Tag, package.json and SDK_VERSION must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRC=$(grep -oP "SDK_VERSION = '\K[^']+" src/index.ts)
          echo "tag=$TAG package.json=$PKG SDK_VERSION=$SRC"
          [ "$TAG" = "$PKG" ] && [ "$PKG" = "$SRC" ] || { echo "version mismatch"; exit 1; }

      # The package has no build script or devDependencies; this reproduces the
      # published dist/ layout (ESM + CJS bundles, .d.ts) with pinned tools.
      - name: Build
        run: |
          npx -y esbuild@0.24.2 src/index.ts --bundle --platform=neutral --format=esm --outfile=dist/index.js
          npx -y esbuild@0.24.2 src/index.ts --bundle --platform=node --format=cjs --outfile=dist/index.cjs
          npx -y -p typescript@5.9.3 tsc src/index.ts --declaration --emitDeclarationOnly --outDir dist \
            --target es2022 --module esnext --moduleResolution bundler --lib es2022,dom --skipLibCheck
          node -e "const m=require('./dist/index.cjs'); if(!m.PdfOps) throw new Error('cjs export missing')"

      - run: npm publish --access public
